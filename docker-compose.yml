---
# Dashboard with Docker label-based auto-discovery - see README for how to
# label other services so they show up here with zero config on this side.
x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-common-labels: &default-labels
  logging_jobname: "containerlogs"
  stackname: ${STACK_NAME:-homepage}

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_VER:-v2.7.0}
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "${HOMEPAGE_ALLOWED_HOSTS:?set HOMEPAGE_ALLOWED_HOSTS to every host it is reached through, port included}"
      # Homepage substitutes any HOMEPAGE_VAR_* container env var for a
      # matching {{HOMEPAGE_VAR_*}} placeholder in config/*.yaml (confirmed
      # via Homepage's own docs) - this is how a widget's credentials (e.g.
      # services.yaml's Proxmox token below) stay out of the config files
      # themselves. Optional/empty by default; add more the same way as
      # more widgets need credentials.
      HOMEPAGE_VAR_PROXMOX_USERNAME: ${HOMEPAGE_VAR_PROXMOX_USERNAME:-}
      HOMEPAGE_VAR_PROXMOX_PASSWORD: ${HOMEPAGE_VAR_PROXMOX_PASSWORD:-}
    volumes:
      # Human-edited YAML (docker.yaml, services.yaml, settings.yaml, etc) -
      # a bind mount, not a named volume, so it's directly editable/visible,
      # same as this engagement's other config-file (not opaque-state)
      # services - see docker-vscode/docker-traefik-portainer.
      #
      # Overridable, unlike those - confirmed live: deployed as a Portainer
      # git-repository stack (not plain `docker compose up`), a relative
      # ./config path resolves against Portainer's own internal /data view,
      # not the real host filesystem (Portainer CE issue #2368/#2046, a
      # known unfixed limitation - "Relative Path Volumes" that actually
      # work is Business Edition only). Set HOMEPAGE_CONFIG_PATH to a real,
      # pre-created absolute host path when deploying this way; the
      # relative default only works for a plain local `docker compose up`.
      - ${HOMEPAGE_CONFIG_PATH:-./config}:/app/config
      # Read-only: Homepage only lists/queries containers for auto-discovery,
      # never manages them - no write access needed.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3000:3000"
    labels:
      <<: *default-labels
    logging: *default-logging
