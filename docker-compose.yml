---
# Dashboard with Docker label-based auto-discovery - see README for how to
# label other services so they show up here with zero config on this side.
x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-common-labels: &default-labels
  logging_jobname: "containerlogs"
  stackname: ${STACK_NAME:-homepage}

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_VER:-v2.7.0}
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "${HOMEPAGE_ALLOWED_HOSTS:?set HOMEPAGE_ALLOWED_HOSTS to every host it is reached through, port included}"
      # Homepage substitutes a HOMEPAGE_FILE_* container env var's file
      # CONTENTS for a matching {{HOMEPAGE_FILE_*}} placeholder in
      # config/*.yaml (confirmed via Homepage's own docs) - this is how a
      # widget's credentials (e.g. services.yaml's Proxmox token) stay out
      # of both the config files and any plaintext env var. The paths
      # below aren't secret - only the files they point at are - so they're
      # fixed, not something to override per-deployment. Add more the same
      # way as more widgets need credentials.
      HOMEPAGE_FILE_PROXMOX_USERNAME: /run/secrets/proxmox_username
      HOMEPAGE_FILE_PROXMOX_PASSWORD: /run/secrets/proxmox_password
    secrets:
      - proxmox_username
      - proxmox_password
    volumes:
      # Human-edited YAML (docker.yaml, services.yaml, settings.yaml, etc) -
      # a bind mount, not a named volume, so it's directly editable/visible,
      # same as this engagement's other config-file (not opaque-state)
      # services - see docker-vscode/docker-traefik-portainer.
      #
      # Overridable, unlike those - confirmed live: deployed as a Portainer
      # git-repository stack (not plain `docker compose up`), a relative
      # ./config path resolves against Portainer's own internal /data view,
      # not the real host filesystem (Portainer CE issue #2368/#2046, a
      # known unfixed limitation - "Relative Path Volumes" that actually
      # work is Business Edition only). Set HOMEPAGE_CONFIG_PATH to a real,
      # pre-created absolute host path when deploying this way; the
      # relative default only works for a plain local `docker compose up`.
      - ${HOMEPAGE_CONFIG_PATH:-./config}:/app/config
      # Read-only: Homepage only lists/queries containers for auto-discovery,
      # never manages them - no write access needed.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3000:3000"
    labels:
      <<: *default-labels
    logging: *default-logging

secrets:
  # Same Portainer git-stack path-resolution bug as HOMEPAGE_CONFIG_PATH
  # above applies here too - compose's secrets `file:` source is resolved
  # the same relative-to-project-dir way a bind-mount volume is. Override
  # HOMEPAGE_SECRETS_PATH to a real, pre-created absolute path (e.g.
  # alongside HOMEPAGE_CONFIG_PATH) when deploying that way.
  proxmox_username:
    file: ${HOMEPAGE_SECRETS_PATH:-./secrets}/proxmox_username
  proxmox_password:
    file: ${HOMEPAGE_SECRETS_PATH:-./secrets}/proxmox_password
